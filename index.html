<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 快樂拼圖尋寶 🌟</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Tailwind slate-50 */
        }

        /* 3D Flip Card CSS */
        .perspective {
            perspective: 1000px;
        }
        
        .tile-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform-style: preserve-3d;
        }
        
        .tile.flipped .tile-inner {
            transform: rotateY(180deg);
        }
        
        .tile-front, .tile-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 0.5rem;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2), 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        /* Front is the "Hidden" side with a pattern/icon */
        .tile-front {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
        }

        .tile-front:hover {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
        }
        
        /* Back is the "Revealed" picture slice */
        .tile-back {
            transform: rotateY(180deg);
            background-repeat: no-repeat;
            background-color: #e2e8f0;
            transition: filter 0.5s ease, opacity 0.5s ease;
        }

        .tile.matched .tile-back {
            filter: grayscale(100%);
            opacity: 0.4;
        }

        #targetPiece {
            background-repeat: no-repeat;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: opacity 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        
        /* Bouncy Buttons for Kids */
        .bouncy-btn {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .bouncy-btn:hover {
            transform: scale(1.05);
        }
        .bouncy-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800 bg-gradient-to-br from-blue-100 via-green-100 to-yellow-100">

    <main class="flex-grow container mx-auto px-4 py-8 max-w-6xl flex flex-col items-center">
        
        <!-- Header -->
        <header id="headerArea" class="text-center mb-6">
            <h1 class="text-5xl font-extrabold tracking-tight text-blue-600 mb-3 drop-shadow-sm">🌟 快樂拼圖尋寶 🌟</h1>
            <p class="text-xl text-green-700 font-bold">把藏起來的拼圖找出來吧！</p>
        </header>

        <!-- Controls -->
        <div id="controlsArea" class="bg-white/80 backdrop-blur-sm p-6 rounded-3xl shadow-xl w-full max-w-3xl mb-8 flex flex-col sm:flex-row gap-4 items-end border-4 border-white">
            <div class="flex-1 w-full">
                <label for="schoolSelect" class="block text-lg font-bold text-blue-700 mb-2">🏫 選擇學校</label>
                <select id="schoolSelect" class="block w-full text-lg text-slate-700 py-3 px-4 rounded-xl border-2 border-blue-200 bg-white focus:outline-none focus:border-blue-500 transition-colors cursor-pointer appearance-none">
                    <option value="" disabled selected>請選擇你的學校...</option>
                    <option value="佛教林金殿紀念小學">佛教林金殿紀念小學</option>
                    <option value="旅港開平商會學校">旅港開平商會學校</option>
                    <option value="香港四邑商工總會新會商會學校">香港四邑商工總會新會商會學校</option>
                    <option value="黃大仙官立小學">黃大仙官立小學</option>
                    <option value="保良局錦泰小學">保良局錦泰小學</option>
                    <option value="元朗朗屏邨東莞學校">元朗朗屏邨東莞學校</option>
                </select>
            </div>

            <div class="w-full sm:w-auto">
                <button id="startBtn" disabled
                    class="w-full bouncy-btn bg-gradient-to-r from-blue-500 to-green-500 hover:from-blue-600 hover:to-green-600 text-white font-extrabold text-lg py-3 px-8 rounded-full shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                    🚀 開始尋寶！
                </button>
            </div>
        </div>

        <!-- Placeholder before upload -->
        <div id="placeholder" class="w-full max-w-md aspect-video border-4 border-dashed border-blue-300 rounded-3xl flex items-center justify-center text-blue-400 bg-white/50 backdrop-blur-sm shadow-inner">
            <div class="text-center">
                <div class="text-6xl mb-3">🏫</div>
                <p class="text-lg font-bold text-green-600">選擇學校來開始遊戲吧！</p>
            </div>
        </div>

        <!-- Game Wrapper -->
        <div id="gameWrapper" class="w-full hidden flex-col items-center flex-grow pt-2">

            <div class="w-full flex flex-col lg:flex-row gap-6 lg:gap-10 items-start justify-center">
                
                <!-- Target Area -->
                <div class="w-full lg:w-1/3 max-w-md mx-auto flex flex-col items-center bg-white/90 backdrop-blur-sm p-6 rounded-3xl shadow-xl border-4 border-white">
                    <h2 class="text-2xl font-extrabold text-blue-700 mb-2 text-center">🔍 找找看這塊拼圖在哪裡？</h2>
                    
                    <!-- Cheer Text for Kids -->
                    <div id="cheerText" class="text-lg font-bold text-orange-500 mb-4 transition-colors h-6 flex items-center justify-center w-full text-center">
                        🚀 準備好了嗎？加油！
                    </div>

                    <div id="targetPieceContainer" class="w-full aspect-square bg-blue-50 rounded-2xl p-3 flex items-center justify-center border-2 border-blue-100 shadow-inner">
                        <div id="targetPiece" class="w-full h-full rounded-xl"></div>
                    </div>
                    <div class="mt-6 text-center text-lg font-extrabold text-orange-600 bg-orange-100 px-6 py-3 rounded-full shadow-sm w-full">
                        🌟 找到數量： <span id="scoreDisplay" class="text-2xl">0</span> / <span id="totalDisplay" class="text-2xl">0</span>
                    </div>
                    <div class="mt-3 text-center text-lg font-extrabold text-green-600 bg-green-100 px-6 py-3 rounded-full shadow-sm w-full flex items-center justify-center gap-2">
                        ⏱️ 尋寶時間：
                        <span id="timeDisplay" class="text-2xl">00:00</span>
                    </div>
                </div>

                <!-- Board Area -->
                <div class="w-full lg:w-2/3 max-w-3xl mx-auto relative">
                    <!-- Grid will be injected here -->
                    <div id="board" class="w-full aspect-square grid gap-2 bg-white/50 backdrop-blur-sm p-3 rounded-3xl shadow-xl border-4 border-white"></div>
                </div>

            </div>
        </div>

        <!-- Full-Screen Success Overlay -->
        <div id="winOverlay" class="fixed inset-0 z-[110] hidden flex-col items-center justify-center bg-slate-900/75 backdrop-blur-md p-4 overflow-y-auto">
            <div class="bg-gradient-to-b from-yellow-50 via-white to-blue-50 p-6 sm:p-8 rounded-3xl shadow-2xl text-center border-4 border-yellow-400 max-w-xl w-full my-auto transform transition-all">
                <div class="text-5xl sm:text-6xl mb-2 animate-bounce">🏆🎉🌟</div>
                
                <div class="bg-gradient-to-r from-green-500 to-blue-600 text-white py-3 px-4 rounded-2xl shadow-md mb-4">
                    <h3 class="text-2xl sm:text-3xl font-black tracking-wide">成功完成挑戰，可以出發了！</h3>
                </div>

                <!-- Full Assembled Picture Preview -->
                <div class="w-full max-w-xs sm:max-w-sm aspect-square mx-auto mb-4 rounded-2xl overflow-hidden border-4 border-yellow-300 shadow-lg bg-slate-100">
                    <img id="completedImage" src="" alt="完成拼圖" class="w-full h-full object-cover" />
                </div>

                <p class="text-lg sm:text-xl text-slate-700 font-bold">
                    總共用了 <span id="finalTimeDisplay" class="text-2xl sm:text-3xl font-black text-orange-600">00:00</span> 真是個尋寶小天才！
                </p>
            </div>
        </div>

        <!-- Countdown Overlay -->
        <div id="countdownOverlay" class="fixed inset-0 z-[100] hidden flex-col items-center justify-center bg-white/80 backdrop-blur-md">
            <div id="countdownText" class="text-8xl md:text-[150px] font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-green-500 drop-shadow-xl transition-all duration-300 transform scale-100">載入中...</div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-slate-500 font-semibold text-sm">
        廠商會中學．小學歷奇定向挑戰日
    </footer>

    <script>
        // ==========================================
        // 遊戲參數設定區 (可依需求自由修改)
        // ==========================================
        const CONFIG = {
            gridRows: 6,            // 拼圖列數 (預設 6)
            gridCols: 6,            // 拼圖行數 (預設 6)
            hintDuration: 5000,     // 提示顯示時間 (毫秒，預設 5000 = 5秒)
            penaltyDuration: 1500,  // 答錯凍結懲罰時間 (毫秒，預設 1500 = 1.5秒)
            maxWrongBeforeHint: 3   // 連續答錯幾次後重新給予提示 (預設 3次)
        };

        // 遊戲狀態變數
        let imgUrl = null;
        let tiles = [];
        let targetSequence = [];
        let currentTargetIndex = 0;
        let isPlaying = false;
        let isAnimating = false;
        let wrongAttemptsForCurrent = 0;
        let timerInterval = null;
        let secondsElapsed = 0;

        // 鼓勵語句庫 (中性可愛風格)
        const CHEER_MESSAGES = {
            start: ["🚀 準備好了嗎？加油！", "🌟 睜大眼睛仔細看喔！", "🔍 一起來尋找寶藏吧！"],
            correct: ["🎉 太棒了！完全正確！", "🌟 好厲害！眼力真好！", "👏 答對了！繼續保持！", "🏆 簡直是尋寶小天才！"],
            wrong: ["💪 沒關係，再試一次！", "🤔 差一點點，再想想看！", "👀 仔細看看圖案的特徵喔！"],
            hint: ["💡 提示時間！快記住位置！", "✨ 魔法提示出現囉！快看！"]
        };

        // DOM 元素參照
        const schoolSelect = document.getElementById('schoolSelect');
        const startBtn = document.getElementById('startBtn');
        const headerArea = document.getElementById('headerArea');
        const controlsArea = document.getElementById('controlsArea');
        const placeholder = document.getElementById('placeholder');
        const gameWrapper = document.getElementById('gameWrapper');
        const board = document.getElementById('board');
        const targetPiece = document.getElementById('targetPiece');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const totalDisplay = document.getElementById('totalDisplay');
        const timeDisplay = document.getElementById('timeDisplay');
        const finalTimeDisplay = document.getElementById('finalTimeDisplay');
        const winOverlay = document.getElementById('winOverlay');
        const completedImage = document.getElementById('completedImage');
        const cheerText = document.getElementById('cheerText');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const countdownText = document.getElementById('countdownText');

        // 事件監聽器
        schoolSelect.addEventListener('change', (e) => {
            const schoolName = e.target.value;
            if (schoolName) {
                imgUrl = `${schoolName}.jpg`;
                startBtn.disabled = false;
                // 預先載入圖片至瀏覽器快取
                const preloadImg = new Image();
                preloadImg.src = imgUrl;
            }
        });

        startBtn.addEventListener('click', startGameFlow);

        // 啟動遊戲流程 (載入圖片 -> 3, 2, 1 倒數 -> 開始遊戲)
        function startGameFlow() {
            if (!imgUrl) return;

            winOverlay.classList.add('hidden');
            winOverlay.classList.remove('flex');
            headerArea.classList.add('hidden');
            controlsArea.classList.add('hidden');
            placeholder.classList.add('hidden');

            countdownOverlay.classList.remove('hidden');
            countdownOverlay.classList.add('flex');
            countdownText.textContent = "載入中...";

            const img = new Image();
            img.onload = () => {
                runCountdown(() => {
                    countdownOverlay.classList.add('hidden');
                    countdownOverlay.classList.remove('flex');
                    gameWrapper.classList.remove('hidden');
                    gameWrapper.classList.add('flex');
                    initGame();
                });
            };
            img.onerror = () => {
                // 若本地圖片載入失敗，提供備用預設圖避免卡住
                imgUrl = "https://placehold.co/800x800/3b82f6/ffffff?text=" + encodeURIComponent(schoolSelect.value || "快樂尋寶");
                runCountdown(() => {
                    countdownOverlay.classList.add('hidden');
                    countdownOverlay.classList.remove('flex');
                    gameWrapper.classList.remove('hidden');
                    gameWrapper.classList.add('flex');
                    initGame();
                });
            };
            img.src = imgUrl;
        }

        function runCountdown(callback) {
            const steps = ["3", "2", "1", "開始！"];
            let stepIndex = 0;

            function nextStep() {
                if (stepIndex < steps.length) {
                    countdownText.textContent = steps[stepIndex];
                    countdownText.classList.remove('scale-100');
                    countdownText.classList.add('scale-125');
                    setTimeout(() => {
                        countdownText.classList.remove('scale-125');
                        countdownText.classList.add('scale-100');
                    }, 150);
                    stepIndex++;
                    setTimeout(nextStep, 800);
                } else {
                    callback();
                }
            }
            nextStep();
        }

        // 初始化遊戲版面與狀態
        function initGame() {
            board.innerHTML = '';
            tiles = [];
            currentTargetIndex = 0;
            wrongAttemptsForCurrent = 0;
            isPlaying = true;
            isAnimating = false;

            const totalTiles = CONFIG.gridRows * CONFIG.gridCols;
            board.style.gridTemplateColumns = `repeat(${CONFIG.gridCols}, minmax(0, 1fr))`;
            board.style.gridTemplateRows = `repeat(${CONFIG.gridRows}, minmax(0, 1fr))`;

            totalDisplay.textContent = totalTiles;
            scoreDisplay.textContent = '0';

            // 產生所有拼圖方塊
            for (let i = 0; i < totalTiles; i++) {
                const row = Math.floor(i / CONFIG.gridCols);
                const col = i % CONFIG.gridCols;

                const tileEl = document.createElement('div');
                tileEl.className = 'tile perspective w-full h-full select-none';

                const innerEl = document.createElement('div');
                innerEl.className = 'tile-inner';

                // 蓋牌面 (顯示編號方便學生溝通)
                const frontEl = document.createElement('div');
                frontEl.className = 'tile-front text-xl sm:text-2xl md:text-3xl font-black text-white drop-shadow';
                frontEl.textContent = i + 1;

                // 翻開面 (顯示圖片切片 + 淡化編號提示)
                const backEl = document.createElement('div');
                backEl.className = 'tile-back relative overflow-hidden';
                backEl.style.backgroundImage = `url('${imgUrl}')`;
                backEl.style.backgroundSize = `${CONFIG.gridCols * 100}% ${CONFIG.gridRows * 100}%`;

                const bgPosX = CONFIG.gridCols > 1 ? (col / (CONFIG.gridCols - 1)) * 100 : 0;
                const bgPosY = CONFIG.gridRows > 1 ? (row / (CONFIG.gridRows - 1)) * 100 : 0;
                backEl.style.backgroundPosition = `${bgPosX}% ${bgPosY}%`;

                // 翻開面上的半透明淡化編號
                const faintNumber = document.createElement('span');
                faintNumber.className = 'absolute inset-0 flex items-center justify-center text-white/45 font-black text-xl sm:text-2xl pointer-events-none drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)]';
                faintNumber.textContent = i + 1;
                backEl.appendChild(faintNumber);

                innerEl.appendChild(frontEl);
                innerEl.appendChild(backEl);
                tileEl.appendChild(innerEl);

                const tileObj = {
                    id: i,
                    row,
                    col,
                    bgPosX,
                    bgPosY,
                    matched: false,
                    element: tileEl
                };

                tileEl.addEventListener('click', () => handleTileClick(tileObj));
                tiles.push(tileObj);
                board.appendChild(tileEl);
            }

            // 隨機打亂目標題目順序
            targetSequence = [...tiles];
            for (let i = targetSequence.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [targetSequence[i], targetSequence[j]] = [targetSequence[j], targetSequence[i]];
            }

            startTimer();
            setNextTarget();
        }

        // 設定下一個尋找目標與提示邏輯
        function setNextTarget() {
            if (currentTargetIndex >= targetSequence.length) {
                isPlaying = false;
                stopTimer();
                finalTimeDisplay.textContent = timeDisplay.textContent;
                completedImage.src = imgUrl;
                setTimeout(() => {
                    winOverlay.classList.remove('hidden');
                    winOverlay.classList.add('flex');
                }, 600);
                return;
            }

            isAnimating = true;
            wrongAttemptsForCurrent = 0;

            const currentTarget = targetSequence[currentTargetIndex];
            targetPiece.style.backgroundImage = `url('${imgUrl}')`;
            targetPiece.style.backgroundSize = `${CONFIG.gridCols * 100}% ${CONFIG.gridRows * 100}%`;
            targetPiece.style.backgroundPosition = `${currentTarget.bgPosX}% ${currentTarget.bgPosY}%`;

            triggerHint(currentTarget);
        }

        // 執行提示翻牌
        function triggerHint(targetTile) {
            const totalTiles = tiles.length;
            const unmatchedTiles = tiles.filter(t => !t.matched);

            // 若未完成方塊大於總數的 1/5，則抽出 1/5 作為提示（必含正確答案）；若少於等於 1/5 則不再提示
            if (unmatchedTiles.length > totalTiles / 5) {
                isAnimating = true;
                setCheerMessage('hint', 'text-blue-600');

                const hintCount = Math.max(1, Math.floor(totalTiles / 5));
                const otherUnmatched = unmatchedTiles.filter(t => t.id !== targetTile.id);

                // 隨機洗牌其餘未完成方塊
                for (let i = otherUnmatched.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [otherUnmatched[i], otherUnmatched[j]] = [otherUnmatched[j], otherUnmatched[i]];
                }

                const hintsToShow = [targetTile, ...otherUnmatched.slice(0, hintCount - 1)];

                hintsToShow.forEach(t => t.element.classList.add('flipped'));

                setTimeout(() => {
                    hintsToShow.forEach(t => {
                        if (!t.matched) {
                            t.element.classList.remove('flipped');
                        }
                    });
                    isAnimating = false;
                    setCheerMessage('start', 'text-orange-500');
                }, CONFIG.hintDuration);
            } else {
                isAnimating = false;
                setCheerMessage('start', 'text-orange-500');
            }
        }

        // 處理方塊點擊事件
        function handleTileClick(tile) {
            if (!isPlaying || isAnimating || tile.matched) return;

            const currentTarget = targetSequence[currentTargetIndex];

            if (tile.id === currentTarget.id) {
                // 答對了！
                isAnimating = true;
                tile.matched = true;
                tile.element.classList.add('flipped', 'matched');

                currentTargetIndex++;
                scoreDisplay.textContent = currentTargetIndex;
                setCheerMessage('correct', 'text-green-600');

                setTimeout(() => {
                    setNextTarget();
                }, 800);
            } else {
                // 答錯了：短暫翻開並凍結懲罰
                isAnimating = true;
                wrongAttemptsForCurrent++;
                tile.element.classList.add('flipped', 'shake');
                setCheerMessage('wrong', 'text-red-500');

                setTimeout(() => {
                    tile.element.classList.remove('flipped', 'shake');

                    if (wrongAttemptsForCurrent >= CONFIG.maxWrongBeforeHint) {
                        wrongAttemptsForCurrent = 0;
                        triggerHint(currentTarget);
                    } else {
                        isAnimating = false;
                    }
                }, CONFIG.penaltyDuration);
            }
        }

        // 更新鼓勵文字
        function setCheerMessage(category, colorClass) {
            const list = CHEER_MESSAGES[category] || CHEER_MESSAGES.start;
            const msg = list[Math.floor(Math.random() * list.length)];
            cheerText.className = `text-lg font-bold mb-4 transition-colors h-6 flex items-center justify-center w-full text-center ${colorClass}`;
            cheerText.textContent = msg;
        }

        // 計時器控制
        function startTimer() {
            stopTimer();
            secondsElapsed = 0;
            updateTimeDisplay();
            timerInterval = setInterval(() => {
                secondsElapsed++;
                updateTimeDisplay();
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimeDisplay() {
            const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const secs = (secondsElapsed % 60).toString().padStart(2, '0');
            timeDisplay.textContent = `${mins}:${secs}`;
        }
    </script>
</body>
</html>
